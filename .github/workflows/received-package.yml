name: received-package

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.changed.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "package=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(package\.json|packages/|openapi/|\.github/workflows/)'; then
            echo "package=true" >>"$GITHUB_OUTPUT"
          else
            git diff --name-only "$base" HEAD | grep -vE '^(README\.md|LICENSE|docs/|skills/)' && exit 1
            echo "package=false" >>"$GITHUB_OUTPUT"
          fi

  package:
    needs: select
    if: needs.select.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify one aligned release version
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$(node -p 'require("./packages/api-schemas/package.json").version')" = "$version" ]
          [ "$(jq -r .info.version openapi/openapi.json)" = "$version" ]
      - name: Pack, install, and import the exact schema package
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" ./packages/api-schemas
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' >"$consumer/package.json"
          cd "$consumer"
          npm install --no-package-lock --ignore-scripts 'zod@^4' "$RUNNER_TEMP"/aventurevc-api-schemas-*.tgz
          node -e 'import("@aventurevc/api-schemas/http/problem-detail").then((module) => { if (typeof module.ProblemDetailSchema?.parse !== "function") throw new Error("ProblemDetailSchema missing"); })'

  required:
    needs: [select, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          selected='${{ needs.select.outputs.package }}'
          result='${{ needs.package.result }}'
          [ '${{ needs.select.result }}' = success ] || exit 1
          if [ "$selected" = true ]; then [ "$result" = success ]; else [ "$result" = skipped ]; fi
